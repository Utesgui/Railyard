<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Railyard</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%231b1d22%27/%3E%3Crect x=%275%27 y=%2710%27 width=%2722%27 height=%2712%27 rx=%272%27 fill=%27%23f2c14e%27/%3E%3Ccircle cx=%2710%27 cy=%2725%27 r=%273%27 fill=%27%23e8e6e0%27/%3E%3Ccircle cx=%2722%27 cy=%2725%27 r=%273%27 fill=%27%23e8e6e0%27/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="map" aria-label="Map"></canvas>
      <div id="hud">
        <header id="topbar" aria-label="Company status"></header>
        <div id="stage">
          <div id="toasts" aria-live="polite" aria-relevant="additions"></div>
          <aside id="panel" class="panel" hidden aria-label="Details"></aside>
          <div id="context" hidden></div>
          <div id="minimap-wrap"><canvas id="minimap" aria-label="Minimap"></canvas><div class="legend"><span>Minimap</span><span class="muted">click to jump</span></div></div>
          <div id="tooltip" hidden role="tooltip"></div>
        </div>
        <footer id="bottombar" aria-label="Tools"><div id="toolbar"></div></footer>
        <div id="dialogs"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
